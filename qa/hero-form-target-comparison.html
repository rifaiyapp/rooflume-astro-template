<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero callback form comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9edf2; color: #061f49; font: 700 14px Arial, sans-serif; }
      main { display: grid; gap: 18px; padding: 18px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      figure { margin: 0; overflow: hidden; background: white; box-shadow: 0 5px 18px rgb(6 31 73 / 15%); }
      figcaption { padding: 10px 14px; border-bottom: 3px solid #ff6a00; letter-spacing: .05em; text-transform: uppercase; }
      .full img { display: block; width: 100%; aspect-ratio: 1917 / 1206; object-fit: cover; object-position: top center; }
      .crop { height: 800px; overflow: hidden; }
      .crop img { display: block; width: 1917px; max-width: none; }
      .reference .crop img { transform: translate(-1300px, -280px); }
      .final .crop img { width: 1920px; transform: translate(-1280px, -190px); }
    </style>
  </head>
  <body>
    <main>
      <div class="row full">
        <figure><figcaption>Screenshot 1 reference</figcaption><img src="reference-form-target.png" alt="" /></figure>
        <figure><figcaption>Crestline implementation</figcaption><img src="hero-form-target-desktop-final.png" alt="" /></figure>
      </div>
      <div class="row">
        <figure class="reference"><figcaption>Reference form detail</figcaption><div class="crop"><img src="reference-form-target.png" alt="" /></div></figure>
        <figure class="final"><figcaption>Final form detail</figcaption><div class="crop"><img src="hero-form-target-desktop-final.png" alt="" /></div></figure>
      </div>
    </main>
  </body>
</html>
